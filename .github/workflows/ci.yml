name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Sample eval
        run: llm-eval --fixtures fixtures --out eval-report.json --require-actual
      - name: Sample eval (JUnit XML)
        run: llm-eval --fixtures fixtures --format junit --out eval-junit.xml --require-actual
      - name: Sample eval (Markdown job summary)
        if: always()
        run: llm-eval --fixtures fixtures --format markdown --require-actual >> "$GITHUB_STEP_SUMMARY"
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: |
            eval-report.json
            eval-junit.xml
          if-no-files-found: ignore
